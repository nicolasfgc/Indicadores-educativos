name: Sondeo de fuentes (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar archivos de muestra
        run: |
          mkdir r && cd r
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          B=https://snies.mineducacion.gov.co/1778
          curl -sL -m 300 -A "$UA" -o snies_matriculados_2025.xlsx "$B/articles-430149_recurso.xlsx"
          curl -sL -m 300 -A "$UA" -o snies_primer_curso_2025.xlsx "$B/articles-430140_recurso.xlsx"
          curl -sL -m 300 -A "$UA" -o snies_graduados_2025.xlsx "$B/articles-430151_recurso.xlsx"
          curl -sL -m 300 -A "$UA" -o snies_matriculados_2017.xlsx "$B/articles-391576_recurso.xlsx"
          curl -sL -m 300 -A "$UA" -o snies.html "https://snies.mineducacion.gov.co/portal/ESTADISTICAS/Bases-consolidadas/"
          W=https://www.icfes.gov.co/wp-content/uploads
          curl -sL -m 300 -A "$UA" -o icfes_s11_2025.xlsx "$W/2026/10/cuadros-salida-saber-11-2025.xlsx"
          curl -sL -m 300 -A "$UA" -o icfes_pro_2025.xlsx "$W/2026/10/cuadros-salida-saber-pro-2025_.xlsx"
          curl -sL -m 300 -A "$UA" -o icfes_tyt_2025.xlsx "$W/2026/10/cuadros-salida-saber-tyt-2025.xlsx"
          curl -sL -m 300 -A "$UA" -o icfes_estadisticas.html "https://www.icfes.gov.co/estadisticas-oficiales/"
          ls -la > lista.txt
          git init -q && git config user.name sondeo && git config user.email s@users.noreply.github.com
          git checkout -q -b sondeo && git add -A && git commit -qm sondeo
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sondeo
