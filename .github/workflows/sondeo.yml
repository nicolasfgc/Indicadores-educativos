name: Sondeo de fuentes (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - name: Probar fuentes
        run: |
          exec > salida.txt 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for u in \
            "https://snies.mineducacion.gov.co/portal/ESTADISTICAS/Bases-consolidadas/" \
            "https://snies.mineducacion.gov.co/1778/w3-propertyvalue-56963.html" \
            "https://www.icfes.gov.co/data-icfes/" \
            "https://www.icfes.gov.co/investigaciones/data-icfes/" ; do
            echo "=================== $u"
            curl -sL -m 60 -A "$UA" -o "p$(echo $u | md5sum | cut -c1-6).html" -w "HTTP %{http_code} %{size_download} %{url_effective}\n" "$u" || true
            grep -oiE 'href="[^"]+"' "p$(echo $u | md5sum | cut -c1-6).html" | grep -iE 'xlsx|xls|zip|csv|matricul|bases|saber|sharepoint|dataicfes|recurso' | sort -u | head -80 || true
          done
      - name: Guardar resultado en la rama sondeo
        if: always()
        run: |
          mkdir r && cd r && git init -q && cp ../salida.txt . && cp ../*.html . 2>/dev/null || true
          git config user.name sondeo && git config user.email s@users.noreply.github.com
          git checkout -q -b sondeo && git add -A && git commit -qm sondeo
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sondeo
